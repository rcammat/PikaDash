services:
  pikadash:
    container_name: pikadash
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    restart: unless-stopped
    ports:
      - "${PIKADASH_PORT:-5001}:5001"
    networks:
      - pikabot_shared
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    container_name: pikadash-cloudflared
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    depends_on:
      pikadash:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - pikabot_shared

networks:
  pikabot_shared:
    external: true
    name: ${PIKABOT_DOCKER_NETWORK:-pikabot_shared}
